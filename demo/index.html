<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lob-reconstruct — AAPL through the opening cross</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23080b10'/%3E%3Crect x='3' y='3' width='9' height='2' fill='%23f0883e'/%3E%3Crect x='3' y='6' width='5' height='2' fill='%23f0883e'/%3E%3Crect x='3' y='9' width='7' height='2' fill='%233d9be9'/%3E%3Crect x='3' y='12' width='4' height='2' fill='%233d9be9'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#080b10; --panel:#0e141d; --panel2:#121a25; --rule:#1b2532;
    --ink:#e6ecf4; --dim:#78879b; --faint:#4a5768;
    --bid:#3d9be9; --ask:#f0883e; --cross:#ffd166;
    --row:21px;
  }
  * { box-sizing:border-box; }
  html,body { background:var(--bg); }
  body {
    margin:0; padding:24px 16px 44px; color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; }
  .num { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-variant-numeric:tabular-nums; }

  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:16px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  h1 .tick { color:var(--dim); font-weight:400; }
  #about { margin-left:auto; font-size:12px; color:var(--dim); }
  #about summary { cursor:pointer; list-style:none; }
  #about summary::-webkit-details-marker { display:none; }
  #about summary::before { content:''; display:inline-block; width:11px; height:11px; margin-right:6px;
    vertical-align:-1px; border:1px solid currentColor; border-radius:50%;
    background:radial-gradient(currentColor 1px, transparent 1.2px) 50% 7.5px/2px 2px no-repeat,
               radial-gradient(currentColor .9px, transparent 1.1px) 50% 3px/2px 2px no-repeat; }
  #about summary:hover { color:var(--ink); }
  #about summary:focus-visible { outline:2px solid var(--bid); outline-offset:2px; border-radius:3px; }
  #aboutbody { margin-top:8px; max-width:78ch; line-height:1.6; color:var(--dim); font-size:12.5px; }
  .readout { display:flex; align-items:baseline; gap:16px; margin:8px 0 14px; }
  .clock { font-size:30px; font-weight:500; line-height:1; }
  .clock .ms { color:var(--dim); font-size:0.62em; }
  .spread { margin-left:auto; color:var(--dim); font-size:11px; letter-spacing:0.07em; }
  .spread b { color:var(--ink); font-weight:600; font-size:15px; letter-spacing:0; margin-left:7px; }

  /* ---- stage: liquidity map + live ladder ------------------------------ */
  .stage { display:flex; gap:12px; align-items:stretch; }
  .mapwrap {
    position:relative; flex:1 1 auto; min-width:0;
    border:1px solid var(--rule); border-radius:7px; background:var(--panel); overflow:hidden;
  }
  #map { display:block; width:100%; height:452px; }
  .maptag {
    position:absolute; left:12px; top:9px; font-size:10.5px; letter-spacing:0.05em;
    color:var(--dim); pointer-events:none;
  }
  .tip {
    position:absolute; display:none; pointer-events:none; z-index:2;
    background:#060a0f; border:1px solid #2b3a4e; border-radius:6px; padding:8px 10px;
    font-size:11.5px; line-height:1.65; color:var(--ink); box-shadow:0 6px 20px rgba(0,0,0,.5);
    white-space:nowrap;
  }
  .tip .h { font-weight:700; font-size:13px; }
  .tip .k { color:var(--dim); }
  .tip table { border-collapse:collapse; margin-top:4px; }
  .tip td { padding:0; }
  .tip td.v { text-align:right; padding-left:16px; font-variant-numeric:tabular-nums; }
  #map { cursor:crosshair; }
  .ladder {
    flex:0 0 328px; border:1px solid var(--rule); border-radius:7px;
    background:var(--panel); overflow:hidden; display:flex; flex-direction:column;
  }
  .lrow { display:grid; grid-template-columns:40px 74px 66px 1fr; align-items:center; height:var(--row); }
  .lhead { height:24px; color:var(--dim); font-size:10px; letter-spacing:0.05em;
           border-bottom:1px solid var(--rule); background:var(--panel2); }
  .lhead > * { padding:0 7px; text-align:right; }
  .lhead .d { text-align:left; padding-left:9px; }
  #ladder { flex:1 1 auto; padding:2px 0; }
  .lrow .oc, .lrow .sh, .lrow .px { padding:0 7px; text-align:right; }
  .lrow .oc { font-size:10.5px; color:var(--dim); }
  .lrow .sh { font-size:12px; color:var(--ink); }
  .lrow .px { font-size:12px; }
  .lrow.ask .px { color:var(--ask); } .lrow.bid .px { color:var(--bid); }
  .lrow .bar { position:relative; height:100%; margin-left:9px; margin-right:7px; }
  .lrow .bar .fill { position:absolute; left:0; top:4px; bottom:4px; border-radius:1px; min-width:2px; }
  .lrow.best { background:#17212f; box-shadow:inset 0 0 0 1px #2b3a4e; }
  .lrow.best .px, .lrow.best .sh { color:var(--ink); font-weight:700; }
  .lrow.ask.best .px { color:#ffa869; }
  .lrow.bid.best .px { color:#6fb8f5; }
  .midrow { height:26px; display:flex; align-items:center; justify-content:center; gap:7px;
            font-size:10.5px; color:var(--dim); letter-spacing:0.03em;
            border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); background:#0a0f16; }
  .midrow b { color:var(--ink); font-weight:600; }

  /* ---- transport ------------------------------------------------------- */
  .transport { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;
               border:1px solid var(--rule); border-radius:7px; background:var(--panel); padding:8px 10px; }
  button { font:inherit; cursor:pointer; }
  .tgroup { display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; background:#0a0f16; }
  .tgroup button { border:0; border-radius:0; background:transparent; color:var(--dim);
                   padding:4px 10px; font-size:12px; line-height:1.4; }
  .tgroup button svg { display:block; width:11px; height:11px; fill:currentColor; }
  .tgroup button + button { border-left:1px solid var(--rule); }
  .tgroup button:hover { background:#141d2a; color:var(--ink); }
  .tgroup button:focus-visible { outline:2px solid var(--bid); outline-offset:-2px; }
  #play { color:var(--ink); min-width:34px; }
  .speeds button { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:11px; padding:4px 9px; }
  .speeds button.on { background:#17212f; color:var(--ink); box-shadow:inset 0 -2px 0 var(--bid); }
  #scrub { flex:1 1 220px; min-width:160px; height:20px; background:transparent; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #scrub::-webkit-slider-runnable-track { height:3px; background:var(--rule); border-radius:2px; }
  #scrub::-moz-range-track { height:3px; background:var(--rule); border-radius:2px; }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; margin-top:-5px; border-radius:50%; background:var(--ink); }
  #scrub::-moz-range-thumb { width:13px; height:13px; border:0; border-radius:50%; background:var(--ink); }
  #scrub:focus-visible { outline:2px solid var(--bid); outline-offset:3px; }
  .stale { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; min-width:172px; }

  .marker { display:none; margin-top:12px; padding:9px 13px; border-radius:6px;
            border:1px solid rgba(255,209,102,0.32); background:rgba(255,209,102,0.08);
            color:var(--cross); font-size:13px; }
  .marker.on { display:block; }
  .cap { margin-top:18px; padding-top:13px; border-top:1px solid var(--rule); color:var(--dim); font-size:11.5px; line-height:1.7; }
  .cap b { color:var(--dim); font-weight:500; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  @media (max-width:860px) {
    .stage { flex-direction:column; }
    .ladder { flex:1 1 auto; }
    #map { height:300px; }
    .clock { font-size:24px; margin-left:0; }
    .spread { margin-left:auto; }
    .stale { min-width:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Level-3 order book replay</h1>
    <details id="about"><summary>About this replay</summary><div id="aboutbody"></div></details>
  </header>
  <div class="readout">
    <div class="clock num" id="clock">--:--:--<span class="ms">.---</span></div>
    <div class="spread" id="state"></div>
  </div>

  <div class="stage">
    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div class="maptag" id="maptag">LIQUIDITY MAP · time → · price ↑ · brightness = resting shares</div>
      <div class="tip" id="tip" role="status"></div>
    </div>
    <div class="ladder">
      <div class="lrow lhead"><div>ORD</div><div>SHARES</div><div>PRICE</div><div class="d">DEPTH</div></div>
      <div id="ladder"></div>
    </div>
  </div>

  <div class="transport">
    <span class="tgroup">
      <button id="first" aria-label="Jump to start" title="Start"></button>
      <button id="prev"  aria-label="Step back one snapshot" title="Step back"></button>
      <button id="play"  aria-label="Play" title="Play / pause (space)"></button>
      <button id="next"  aria-label="Step forward one snapshot" title="Step forward"></button>
      <button id="lastb" aria-label="Jump to end" title="End"></button>
    </span>
    <span class="tgroup speeds">
      <button class="spd" data-s="1">1×</button><button class="spd on" data-s="10">10×</button><button class="spd" data-s="100">100×</button>
    </span>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scrub through the replay">
    <span class="stale" id="stale"></span>
  </div>

  <div class="marker" id="marker"></div>
  <div class="cap" id="cap"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const S = window.SLICE || [], META = window.META || {}, PERF = window.PERF;
  const snaps = S.filter(r => r.b), marks = S.filter(r => !r.b);
  const $ = id => document.getElementById(id);
  if (!snaps.length) { $('state').textContent = 'no data.js — run demo/make_demo.py'; return; }

  $('title').innerHTML = `${META.symbol || ''} <span class="tick">· NASDAQ TotalView-ITCH 5.0 · ${META.date || ''}</span>`;
  $('aboutbody').innerHTML =
    'Every order rebuilt from the raw NASDAQ TotalView-ITCH 5.0 feed. The map is the whole replay at once — each column '
    + 'is the book at that instant and brightness is shares resting at that price; the ladder is the book right now, with '
    + 'each depth bar split into one segment per resting order. That order count is the Level-3 detail a depth feed cannot '
    + 'carry. Hover the map for the level under the cursor and how long it has stood. The slice holds the '
    + '<b>top ten levels a side</b>, so this is the band of displayed liquidity around the touch, not full depth.';

  const clock = $('clock'), state = $('state'), ladder = $('ladder'), scrub = $('scrub'),
        marker = $('marker'), stale = $('stale'), cv = $('map'), ctx = cv.getContext('2d');
  scrub.max = snaps.length - 1;

  const fmtT = ns => {
    const ms = Math.floor(ns / 1e6);
    const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60, f = ms % 1000;
    return [String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'), String(f).padStart(3,'0')];
  };
  const fmtN = n => n.toLocaleString('en-US');
  const fmtK = n => n >= 10000 ? (n/1000).toFixed(1)+'K' : fmtN(n);

  // One segment per resting order. Capped: past ~40 the gaps stop resolving and a solid bar is the honest rendering.
  function segments(count, colour) {
    const n = Math.max(1, Math.min(count | 0, 40));
    if (n === 1) return colour;
    const w = 100 / n;
    return `repeating-linear-gradient(90deg, ${colour} 0, ${colour} calc(${w}% - 1.5px), transparent calc(${w}% - 1.5px), transparent ${w}%)`;
  }

  // ---- liquidity map ----------------------------------------------------
  // Static: the whole window is drawn once to an offscreen canvas, then each frame is that image plus a playhead.
  // X is linear in time, not in snapshot index, so a quiet book draws as a wide flat band instead of being compressed.
  const T0 = snaps[0].t, T1 = snaps[snaps.length - 1].t;
  let PLO = Infinity, PHI = -Infinity, SMAX = 1;
  for (const s of snaps) for (const l of s.b.concat(s.a)) {
    if (l[0] < PLO) PLO = l[0]; if (l[0] > PHI) PHI = l[0]; if (l[1] > SMAX) SMAX = l[1];
  }
  PLO -= 0.02; PHI += 0.02;
  const PAD_L = 54, PAD_B = 18, PAD_T = 46;
  let off = document.createElement('canvas'), octx = off.getContext('2d'), W = 0, H = 0, dpr = 1, crossHit = null;

  const xOf = t => PAD_L + (W - PAD_L - 6) * (t - T0) / (T1 - T0);
  const yOf = p => PAD_T + (H - PAD_T - PAD_B) * (PHI - p) / (PHI - PLO);

  function paintMap() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    for (const c of [cv, off]) { c.width = W * dpr; c.height = H * dpr; }
    off.style.width = W + 'px';
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, W, H);

    const tickH = Math.max(1.5, (H - PAD_T - PAD_B) / ((PHI - PLO) * 100));

    // price gridlines and labels, every 25 cents
    octx.font = '10px ui-monospace, Menlo, Consolas, monospace';
    octx.textAlign = 'right'; octx.textBaseline = 'middle';
    for (let p = Math.ceil(PLO * 4) / 4; p <= PHI; p += 0.25) {
      const y = yOf(p);
      octx.strokeStyle = '#1f2a39'; octx.beginPath();
      octx.moveTo(PAD_L, y + 0.5); octx.lineTo(W - 6, y + 0.5); octx.stroke();
      octx.fillStyle = '#8b9aae'; octx.fillText('$' + p.toFixed(2), PAD_L - 7, y);
    }
    // time labels on the minute
    octx.textAlign = 'center'; octx.textBaseline = 'top';
    for (let t = Math.ceil(T0 / 60e9) * 60e9; t <= T1; t += 60e9) {
      const x = xOf(t);
      octx.strokeStyle = '#1f2a39'; octx.beginPath();
      octx.moveTo(x + 0.5, PAD_T); octx.lineTo(x + 0.5, H - PAD_B); octx.stroke();
      octx.fillStyle = '#8b9aae'; octx.fillText(fmtT(t)[0].slice(0, 5), x, H - PAD_B + 4);
    }

    // the book itself: one rectangle per resting level, spanning until the next snapshot
    const logMax = Math.log1p(SMAX);
    for (let i = 0; i < snaps.length; i++) {
      const s = snaps[i];
      const x = xOf(s.t), x2 = i + 1 < snaps.length ? xOf(snaps[i + 1].t) : W - 6;
      const w = Math.max(1, x2 - x);
      for (const [side, rows] of [['a', s.a], ['b', s.b]]) {
        for (const l of rows) {
          const a = 0.14 + 0.86 * Math.log1p(l[1]) / logMax;
          octx.fillStyle = side === 'a' ? `rgba(240,136,62,${a})` : `rgba(61,155,233,${a})`;
          octx.fillRect(x, yOf(l[0]) - tickH / 2, w, tickH);
        }
      }
    }
    // the opening auction print
    crossHit = null;
    for (const m of marks) if (m.cross) {
      const x = xOf(m.t);
      octx.strokeStyle = 'rgba(255,209,102,0.85)'; octx.setLineDash([3, 3]);
      octx.beginPath(); octx.moveTo(x + 0.5, PAD_T); octx.lineTo(x + 0.5, H - PAD_B); octx.stroke();
      octx.setLineDash([]);
      octx.fillStyle = '#ffd166'; octx.textBaseline = 'top';
      const label = 'cross ' + fmtN(m.shares) + ' @ $' + m.price.toFixed(2);
      const fits = x + 5 + octx.measureText(label).width < W - 6;   // flip to the left rather than run off
      octx.textAlign = fits ? 'left' : 'right';
      octx.fillText(label, x + (fits ? 5 : -5), PAD_T + 2);
      const lw = octx.measureText(label).width;
      crossHit = { x0: fits ? x : x - 5 - lw, x1: fits ? x + 5 + lw : x, y0: PAD_T, y1: PAD_T + 14, mark: m };
    }
  }

  function paintFrame(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(off, 0, 0, W, H);
    const x = xOf(Math.min(Math.max(t, T0), T1));
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 0.5, PAD_T); ctx.lineTo(x + 0.5, H - PAD_B); ctx.stroke();
    // the playhead says what time it is, so the clock, the map and the ladder are visibly the same instant
    const lab = fmtT(t)[0], pad = 5;
    ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
    const w = ctx.measureText(lab).width + pad * 2, left = Math.min(Math.max(x - w / 2, PAD_L), W - 6 - w);
    ctx.fillStyle = '#e6ecf4';
    ctx.fillRect(left, PAD_T - 17, w, 14);
    ctx.fillStyle = '#080b10'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(lab, left + pad, PAD_T - 10);
  }

  // ---- ladder -----------------------------------------------------------
  let i = 0, playing = false, speed = 10, last = 0, simT = snaps[0].t;

  function paintClock(ns) { const [a, b] = fmtT(ns); clock.innerHTML = `${a}<span class="ms">.${b}</span>`; }
  function paintStale(ns) {
    const dt = (ns - snaps[i].t) / 1e9;
    stale.textContent = dt >= 2 ? `book unchanged for ${dt.toFixed(0)} s` : '';
  }

  function render(k) {
    i = k;
    const s = snaps[k];
    simT = Math.max(simT, s.t);
    paintClock(s.t); scrub.value = k;

    const bb = s.b.length ? s.b[0][0] : null, ba = s.a.length ? s.a[0][0] : null;
    const crossed = bb !== null && ba !== null && bb >= ba;
    state.innerHTML = crossed ? '<b>crossed</b>'
      : (bb !== null && ba !== null ? `spread <b>$${(ba - bb).toFixed(2)}</b>` : '');

    const maxSh = Math.max(1, ...s.b.map(l => l[1]), ...s.a.map(l => l[1]));
    let html = '';
    for (let j = s.a.length - 1; j >= 0; j--) html += rowHtml('ask', s.a[j], s.a[j][0] === ba, maxSh);
    html += bb !== null && ba !== null
      ? `<div class="midrow">${crossed ? '<span>book crossed</span>'
          : `<span>spread</span><b class="num">$${(ba-bb).toFixed(2)}</b><span>·</span><span>mid</span><b class="num">$${((bb+ba)/2).toFixed(3)}</b>`}</div>`
      : '<div class="midrow"><span>one side empty</span></div>';
    for (const l of s.b) html += rowHtml('bid', l, l[0] === bb, maxSh);
    ladder.innerHTML = html;

    const cross = marks.filter(m => m.cross && m.t <= s.t).slice(-1)[0];
    if (cross && s.t - cross.t < 30e9) {
      marker.classList.add('on');
      marker.innerHTML = `<b>${fmtT(cross.t)[0]}</b> — opening cross printed: <b class="num">${fmtN(cross.shares)}</b> shares at <b class="num">$${cross.price.toFixed(2)}</b> in one message (Q, type ${cross.cross})`;
    } else marker.classList.remove('on');
    paintFrame(s.t);
  }

  function rowHtml(side, l, isBest, maxSh) {
    const w = Math.max(3, 100 * l[1] / maxSh);
    const colour = side === 'bid' ? '#3d9be9' : '#f0883e';
    return `<div class="lrow ${side}${isBest ? ' best' : ''}">`
      + `<div class="oc num">${fmtN(l[2])}</div><div class="sh num">${fmtK(l[1])}</div>`
      + `<div class="px num">${l[0].toFixed(2)}</div>`
      + `<div class="bar"><div class="fill" style="width:${w}%;background:${segments(l[2], colour)}"></div></div></div>`;
  }

  // ---- transport --------------------------------------------------------
  function tick(now) {
    if (!playing) return;
    if (last) {
      simT += (now - last) * 1e6 * speed;
      let k = i;
      while (k + 1 < snaps.length && snaps[k + 1].t <= simT) k++;
      if (k !== i) render(k);
      paintClock(simT); paintStale(simT); paintFrame(simT);
    }
    last = now;
    if (i >= snaps.length - 1) { playing = false; $('play').innerHTML = ICON.play; last = 0; return; }
    requestAnimationFrame(tick);
  }
  function toggle() {
    if (i >= snaps.length - 1) { simT = snaps[0].t; render(0); }
    playing = !playing; $('play').innerHTML = playing ? ICON.pause : ICON.play;
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play'); last = 0;
    if (!playing) stale.textContent = '';
    if (playing) requestAnimationFrame(tick);
  }
  const ICON = {
    first: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="2" height="10"/><path d="M11 1 4 6l7 5z"/></svg>',
    prev:  '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M10 1 3 6l7 5z"/></svg>',
    play:  '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l7 5-7 5z"/></svg>',
    pause: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>',
    next:  '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l7 5-7 5z"/></svg>',
    last:  '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l7 5-7 5z"/><rect x="9" y="1" width="2" height="10"/></svg>',
  };
  $('first').innerHTML = ICON.first; $('prev').innerHTML = ICON.prev;
  $('play').innerHTML = ICON.play;   $('next').innerHTML = ICON.next; $('lastb').innerHTML = ICON.last;

  function goto(k) { playing = false; $('play').innerHTML = ICON.play; stale.textContent = ''; simT = snaps[k].t; render(k); }
  $('play').onclick = toggle;
  $('first').onclick = () => goto(0);
  $('lastb').onclick = () => goto(snaps.length - 1);
  $('prev').onclick  = () => goto(Math.max(0, i - 1));
  $('next').onclick  = () => goto(Math.min(snaps.length - 1, i + 1));
  document.querySelectorAll('.spd').forEach(b => b.onclick = () => {
    speed = +b.dataset.s;
    document.querySelectorAll('.spd').forEach(x => x.classList.toggle('on', x === b));
  });
  scrub.oninput = () => { simT = snaps[+scrub.value].t; render(+scrub.value); stale.textContent = ''; };
  const tip = $('tip');
  const TICK = 0.01;
  function levelAt(k, price, side) {
    const rows = side === 'a' ? snaps[k].a : snaps[k].b;
    for (const l of rows) if (Math.abs(l[0] - price) < TICK / 2) return l;
    return null;
  }
  // How long a level at this price has stood, by walking the snapshots either side. Only uses what the slice holds:
  // presence of a level at a price. It says nothing about which orders came and went - the slice does not carry that.
  function standing(k, price, side) {
    let a = k, b = k;
    while (a > 0 && levelAt(a - 1, price, side)) a--;
    while (b + 1 < snaps.length && levelAt(b + 1, price, side)) b++;
    return { from: snaps[a].t, to: snaps[b].t, secs: (snaps[b].t - snaps[a].t) / 1e9 };
  }
  const fmtDur = sec => sec >= 60 ? `${Math.floor(sec/60)}m ${Math.round(sec%60)}s` : `${sec.toFixed(1)}s`;

  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const t = T0 + (T1 - T0) * (mx - PAD_L) / (r.width - PAD_L - 6);
    const price = Math.round((PHI - (PHI - PLO) * (my - PAD_T) / (r.height - PAD_T - PAD_B)) * 100) / 100;
    if (t < T0 || t > T1) { tip.style.display = 'none'; return; }
    let k = 0; while (k + 1 < snaps.length && snaps[k + 1].t <= t) k++;
    const side = levelAt(k, price, 'a') ? 'a' : (levelAt(k, price, 'b') ? 'b' : null);
    if (!side) { tip.style.display = 'none'; return; }
    const l = levelAt(k, price, side), st = standing(k, price, side);
    tip.innerHTML =
      `<div class="h" style="color:${side === 'a' ? '#f0883e' : '#3d9be9'}">$${l[0].toFixed(2)} <span class="k" style="font-weight:400">${side === 'a' ? 'ask' : 'bid'}</span></div>`
      + `<table>`
      + `<tr><td class="k">resting</td><td class="v">${fmtN(l[1])} shares</td></tr>`
      + `<tr><td class="k">orders</td><td class="v">${fmtN(l[2])}</td></tr>`
      + `<tr><td class="k">standing</td><td class="v">${fmtDur(st.secs)}</td></tr>`
      + `<tr><td class="k">from</td><td class="v">${fmtT(st.from)[0]}</td></tr>`
      + `<tr><td class="k">to</td><td class="v">${fmtT(st.to)[0]}</td></tr>`
      + `</table>`;
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(mx + 14, r.width - tw - 8) + 'px';
    tip.style.top = Math.max(6, Math.min(my - th / 2, r.height - th - 6)) + 'px';
  });
  cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

  cv.addEventListener('click', e => {                       // click the map to jump there
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let t = T0 + (T1 - T0) * (mx - PAD_L) / (r.width - PAD_L - 6);
    if (crossHit && mx >= crossHit.x0 - 3 && mx <= crossHit.x1 + 3 && my >= crossHit.y0 - 3 && my <= crossHit.y1 + 3) {
      t = crossHit.mark.t;                                  // the annotation is a target, not just a caption
    }
    let k = 0; while (k + 1 < snaps.length && snaps[k + 1].t <= t) k++;
    playing = false; $('play').innerHTML = ICON.play; stale.textContent = '';
    simT = snaps[k].t; render(k);
  });
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight' && i < snaps.length - 1) { playing = false; $('play').innerHTML = ICON.play; simT = snaps[i+1].t; render(i + 1); }
    if (e.key === 'ArrowLeft'  && i > 0)                { playing = false; $('play').innerHTML = ICON.play; simT = snaps[i-1].t; render(i - 1); }
  });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { paintMap(); paintFrame(snaps[i].t); }, 120); });

  $('cap').innerHTML =
    `<b>${fmtN(snaps.length)}</b> snapshots on a 100 ms grid — only grid points where the top of book changed, so a flat `
    + `band on the map is a genuinely still book. The map carries the <b>top ten levels a side</b>, which is what the slice `
    + `holds; it is not full depth. Click the map to jump, space plays and pauses, arrow keys step one snapshot.`
    + (PERF ? `<br>Engine apply latency, 20-symbol subset, final configuration (${PERF.gc}): `
        + `p50 <b>${fmtN(PERF.p50)} ns</b> · p90 <b>${fmtN(PERF.p90)} ns</b> · p99 <b>${fmtN(PERF.p99)} ns</b> · p99.9 <b>${fmtN(PERF.p999)} ns</b> · max <b>${(PERF.max/1e6).toFixed(1)} ms</b>`
        + (PERF.msgsPerSec ? `. Full day <b>${fmtN(PERF.msgsPerSec)} msgs/s</b>, single-threaded.` : '.') : '');

  paintMap();
  render(0);
})();
</script>
</body>
</html>
