<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lob-reconstruct — AAPL through the opening cross</title>
<style>
  :root {
    --bg:#080b10; --panel:#0e141d; --panel2:#121a25; --rule:#1b2532;
    --ink:#e6ecf4; --dim:#78879b; --faint:#4a5768;
    --bid:#3d9be9; --ask:#f0883e; --cross:#ffd166;
    --row:22px;
  }
  * { box-sizing:border-box; }
  html,body { background:var(--bg); }
  body {
    margin:0; padding:28px 16px 48px; color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:880px; margin:0 auto; }
  .num { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-variant-numeric:tabular-nums; }

  /* ---- header ---------------------------------------------------------- */
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size:19px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  h1 .tick { color:var(--dim); font-weight:400; }
  .clock { font-size:30px; font-weight:500; letter-spacing:0; line-height:1; }
  .clock .ms { color:var(--dim); font-size:0.62em; }
  .feed { color:var(--dim); font-size:12.5px; margin:6px 0 20px; }

  /* ---- transport ------------------------------------------------------- */
  .transport { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  button {
    font:inherit; font-size:13px; color:var(--ink); background:var(--panel2);
    border:1px solid var(--rule); border-radius:5px; padding:5px 11px; cursor:pointer;
  }
  button:hover { border-color:#31415a; }
  button:focus-visible { outline:2px solid var(--bid); outline-offset:2px; }
  #play { min-width:76px; font-weight:500; }
  .speeds { display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; }
  .speeds button { border:0; border-radius:0; background:transparent; color:var(--dim); padding:5px 10px; }
  .speeds button + button { border-left:1px solid var(--rule); }
  .speeds button.on { background:var(--bid); color:#04090f; font-weight:600; }
  .spread { margin-left:auto; color:var(--dim); font-size:13px; }
  .spread b { color:var(--ink); font-weight:500; }
  .spread.crossed { color:var(--cross); }
  .spread.crossed b { color:var(--cross); }
  input[type=range] {
    width:100%; margin:0 0 18px; height:20px; background:transparent; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  input[type=range]::-webkit-slider-runnable-track { height:3px; background:var(--rule); border-radius:2px; }
  input[type=range]::-moz-range-track { height:3px; background:var(--rule); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; margin-top:-5px; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-thumb { width:13px; height:13px; border:0; border-radius:50%; background:var(--ink); }
  input[type=range]:focus-visible { outline:2px solid var(--bid); outline-offset:3px; }

  /* ---- ladder ---------------------------------------------------------- */
  .ladder { border:1px solid var(--rule); border-radius:7px; background:var(--panel); overflow:hidden; }
  .lrow { display:grid; grid-template-columns:62px 92px 84px 1fr; align-items:center; height:var(--row); }
  .lhead {
    height:26px; color:var(--faint); font-size:10.5px; letter-spacing:0.06em;
    border-bottom:1px solid var(--rule); background:var(--panel2);
  }
  .lhead > * { padding:0 10px; text-align:right; }
  .lhead .depth { text-align:left; padding-left:12px; }
  #ladder { min-height:calc(var(--row) * 20); padding:3px 0; }

  .lrow .oc, .lrow .sh, .lrow .px { padding:0 10px; text-align:right; }
  .lrow .oc { font-size:11px; color:var(--faint); }
  .lrow .sh { font-size:12.5px; color:var(--ink); }
  .lrow .px { font-size:12.5px; color:var(--dim); }
  .lrow .bar { position:relative; height:100%; margin-left:12px; }
  .lrow .bar .fill { position:absolute; left:0; top:4px; bottom:4px; border-radius:1px; min-width:2px; }

  .lrow.best .px, .lrow.best .sh { color:var(--ink); font-weight:600; }
  .lrow.best { background:#141d2a; }
  .lrow.ask .px { color:var(--ask); }
  .lrow.bid .px { color:var(--bid); }
  .lrow.xrow { background:rgba(255,209,102,0.07); }

  .spreadrow {
    height:26px; display:flex; align-items:center; justify-content:center; gap:9px;
    font-size:11px; color:var(--faint); letter-spacing:0.04em;
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); background:#0a0f16;
  }
  .spreadrow b { color:var(--ink); font-weight:600; }
  .spreadrow.crossed { color:var(--cross); background:rgba(255,209,102,0.08); }

  /* ---- marker + events ------------------------------------------------- */
  .marker {
    display:none; margin-top:12px; padding:9px 13px; border-radius:6px;
    border:1px solid rgba(255,209,102,0.32); background:rgba(255,209,102,0.08); color:var(--cross); font-size:13px;
  }
  .marker.on { display:block; }
  .tape { margin-top:12px; font-size:11.5px; color:var(--faint); line-height:1.8; }
  .tape span { color:var(--dim); }
  .cap { margin-top:22px; padding-top:14px; border-top:1px solid var(--rule); color:var(--faint); font-size:11.5px; line-height:1.7; }
  .cap b { color:var(--dim); font-weight:500; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
  @media (max-width:620px) {
    body { padding:20px 12px 40px; }
    .lrow { grid-template-columns:50px 62px 58px 1fr; }
    .lhead { font-size:9.5px; letter-spacing:0.02em; }
    .lrow .oc, .lrow .sh, .lrow .px { padding:0 6px; }
    .lrow .oc { font-size:10.5px; }
    .lrow .sh, .lrow .px { font-size:11.5px; }
    .lrow .bar { margin-left:8px; margin-right:8px; }
    .lhead > * { padding:0 6px; }
    .lhead .depth { padding-left:8px; }
    .lhead .hint { display:none; }
    .clock { font-size:26px; }
    .spread { margin-left:0; width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Level-3 order book replay</h1>
    <div class="clock num" id="clock">--:--:--<span class="ms">.---</span></div>
  </header>
  <p class="feed" id="subtitle">NASDAQ TotalView-ITCH 5.0, reconstructed order by order.</p>

  <div class="transport">
    <button id="play">Play</button>
    <span class="speeds">
      <button class="spd on" data-s="1">1×</button><button class="spd" data-s="10">10×</button><button class="spd" data-s="100">100×</button>
    </span>
    <span class="spread" id="state"></span>
  </div>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scrub through the replay">

  <div class="ladder">
    <div class="lrow lhead">
      <div>ORDERS</div><div>SHARES</div><div>PRICE</div><div class="depth">DEPTH <span class="hint">— one segment per resting order</span></div>
    </div>
    <div id="ladder"></div>
  </div>

  <div class="marker" id="marker"></div>
  <div class="tape" id="events"></div>
  <div class="cap" id="cap"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const S = window.SLICE || [], META = window.META || {}, PERF = window.PERF;
  const snaps = S.filter(r => r.b), marks = S.filter(r => !r.b);
  const $ = id => document.getElementById(id);
  if (!snaps.length) { $('state').textContent = 'no data.js — run demo/make_demo.py'; return; }

  $('title').innerHTML = `${META.symbol || ''} <span class="tick">through the opening cross</span>`;
  $('subtitle').textContent =
    `NASDAQ TotalView-ITCH 5.0, ${META.date || ''} — every order rebuilt from the raw feed. Ten levels a side, and each bar is `
    + `split into one segment per resting order: the detail a Level-2 depth feed cannot carry. Watch the spread collapse once `
    + `the opening auction prints and continuous trading takes over.`;

  const clock = $('clock'), state = $('state'), ladder = $('ladder'), scrub = $('scrub'),
        marker = $('marker'), events = $('events');
  scrub.max = snaps.length - 1;

  const fmtT = ns => {
    const ms = Math.floor(ns / 1e6);
    const h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60, f = ms % 1000;
    return [String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'), String(f).padStart(3,'0')];
  };
  const fmtN = n => n.toLocaleString('en-US');

  // One segment per resting order: the bar carries the order count, not just the size.
  // Capped because past ~40 the gaps stop resolving and a solid bar is the honest rendering.
  function segments(count, colour) {
    const n = Math.max(1, Math.min(count | 0, 40));
    if (n === 1) return colour;
    const w = 100 / n;
    return `repeating-linear-gradient(90deg, ${colour} 0, ${colour} calc(${w}% - 1.5px), transparent calc(${w}% - 1.5px), transparent ${w}%)`;
  }

  let i = 0, playing = false, speed = 1, last = 0, simT = snaps[0].t;

  function render(k) {
    i = k;
    const s = snaps[k];
    simT = Math.max(simT, s.t);
    const [hms, ms] = fmtT(s.t);
    clock.innerHTML = `${hms}<span class="ms">.${ms}</span>`;
    scrub.value = k;

    const bid = new Map(s.b.map(l => [l[0], l])), ask = new Map(s.a.map(l => [l[0], l]));
    const bb = s.b.length ? s.b[0][0] : null, ba = s.a.length ? s.a[0][0] : null;
    const crossed = bb !== null && ba !== null && bb >= ba;

    state.className = 'spread' + (crossed ? ' crossed' : '');
    state.innerHTML = crossed
      ? 'book crossed — pre-open'
      : (bb !== null && ba !== null ? `spread <b>$${(ba - bb).toFixed(2)}</b>` : '');

    const maxSh = Math.max(1, ...s.b.map(l => l[1]), ...s.a.map(l => l[1]));
    let html = '';
    for (let j = s.a.length - 1; j >= 0; j--) html += rowHtml('ask', s.a[j], s.a[j][0] === ba, maxSh, crossed && s.a[j][0] <= bb);
    html += crossed
      ? `<div class="spreadrow crossed"><span>book crossed</span><span>·</span><span>bid <b class="num">$${bb.toFixed(2)}</b> above ask <b class="num">$${ba.toFixed(2)}</b></span></div>`
      : (bb !== null && ba !== null
          ? `<div class="spreadrow"><span>spread</span><b class="num">$${(ba - bb).toFixed(2)}</b><span>·</span><span>mid</span><b class="num">$${((bb + ba) / 2).toFixed(3)}</b></div>`
          : `<div class="spreadrow"><span>one side empty</span></div>`);
    for (const l of s.b) html += rowHtml('bid', l, l[0] === bb, maxSh, crossed && l[0] >= ba);
    ladder.innerHTML = html;

    const seen = marks.filter(m => m.t <= s.t);
    const cross = seen.filter(m => m.cross).slice(-1)[0];
    if (cross && s.t - cross.t < 30e9) {
      marker.classList.add('on');
      marker.innerHTML = `<b>${fmtT(cross.t)[0]}</b> — opening cross printed: <b class="num">${fmtN(cross.shares)}</b> shares at <b class="num">$${cross.price.toFixed(2)}</b> in one message (Q, type ${cross.cross})`;
    } else marker.classList.remove('on');

    events.innerHTML = seen.map(m => m.cross
      ? `<span>${fmtT(m.t)[0]}</span> cross ${m.cross} ${fmtN(m.shares)} @ $${m.price.toFixed(2)}`
      : `<span>${fmtT(m.t)[0]}</span> system event ${m.system}${m.system === 'Q' ? ' — market open' : ''}`
    ).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
  }

  function rowHtml(side, l, isBest, maxSh, inX) {
    const w = Math.max(0.6, 100 * l[1] / maxSh);
    const colour = side === 'bid' ? '#3d9be9' : '#f0883e';
    return `<div class="lrow ${side}${isBest ? ' best' : ''}${inX ? ' xrow' : ''}">`
      + `<div class="oc num">${fmtN(l[2])}</div>`
      + `<div class="sh num">${fmtN(l[1])}</div>`
      + `<div class="px num">${l[0].toFixed(2)}</div>`
      + `<div class="bar"><div class="fill" style="width:${w}%;background:${segments(l[2], colour)}"></div></div>`
      + `</div>`;
  }

  function tick(now) {
    if (!playing) return;
    if (last) {
      simT += (now - last) * 1e6 * speed;
      let k = i;
      while (k + 1 < snaps.length && snaps[k + 1].t <= simT) k++;
      if (k !== i) render(k);
    }
    last = now;
    if (i >= snaps.length - 1) { playing = false; $('play').textContent = 'Replay'; last = 0; return; }
    requestAnimationFrame(tick);
  }
  function toggle() {
    if (i >= snaps.length - 1) { simT = snaps[0].t; render(0); }
    playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; last = 0;
    if (playing) requestAnimationFrame(tick);
  }
  $('play').onclick = toggle;
  document.querySelectorAll('.spd').forEach(b => b.onclick = () => {
    speed = +b.dataset.s;
    document.querySelectorAll('.spd').forEach(x => x.classList.toggle('on', x === b));
  });
  scrub.oninput = () => { simT = snaps[+scrub.value].t; render(+scrub.value); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight' && i < snaps.length - 1) { playing = false; $('play').textContent = 'Play'; simT = snaps[i+1].t; render(i + 1); }
    if (e.key === 'ArrowLeft' && i > 0) { playing = false; $('play').textContent = 'Play'; simT = snaps[i-1].t; render(i - 1); }
  });

  $('cap').innerHTML =
    `<b>${fmtN(snaps.length)}</b> snapshots on a 100 ms grid — only grid points where the top of book changed. `
    + `Space plays and pauses; arrow keys step one snapshot. `
    + (PERF
      ? `<br>Engine apply latency, 20-symbol subset, final configuration (${PERF.gc}): `
        + `p50 <b>${fmtN(PERF.p50)} ns</b> · p90 <b>${fmtN(PERF.p90)} ns</b> · p99 <b>${fmtN(PERF.p99)} ns</b> · p99.9 <b>${fmtN(PERF.p999)} ns</b> · max <b>${(PERF.max / 1e6).toFixed(1)} ms</b>`
        + (PERF.msgsPerSec ? `. Full day <b>${fmtN(PERF.msgsPerSec)} msgs/s</b>, single-threaded.` : '.')
      : `Latency percentiles: see docs/perf.md.`);

  render(0);
})();
</script>
</body>
</html>
