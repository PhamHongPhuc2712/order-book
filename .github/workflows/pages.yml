# Publishes demo/ (index.html + the generated data.js slice) to GitHub Pages (Phase 4 Task 3 Step 4).
# Needs Pages enabled for the repository with source "GitHub Actions" (Settings -> Pages).
name: pages
on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: demo }
      - id: deployment
        uses: actions/deploy-pages@v4
