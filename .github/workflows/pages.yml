# Publishes demo/ (index.html + the generated data.js slice) to GitHub Pages (Phase 4 Task 3 Step 4).
# One-time manual step: Settings -> Pages -> Source: GitHub Actions. The API call that would do it from here
# (configure-pages enablement: true) is not permitted for the default workflow token, and fails the job.
# After that, this deploys on any push touching demo/ or this file, and can also be started from the Actions tab.
name: pages
on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: demo }
      - id: deployment
        uses: actions/deploy-pages@v4
